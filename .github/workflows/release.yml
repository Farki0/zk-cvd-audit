# On a published release: build the runtime image from the Dockerfile and publish it to the GitHub Container
# Registry under the release tag, so that the Zenodo version and the image match; Zenodo archives the release itself.
# Adapted from the TDK code template: the image name is lowercased because ghcr
# rejects the uppercase letter of the owner name.
name: release
on:
  release: { types: [published] }
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: "${{ steps.name.outputs.image }}:${{ github.event.release.tag_name }}"
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
